<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#008069">
<title>Simulador Bot Zulma</title>
<style>
:root{
  --wall:#efeae2;--wall-dot:#d9d2c5;--head:#008069;--head-txt:#fff;--head-sub:#cdeee6;
  --in:#fff;--out:#d9fdd3;--txt:#111b21;--mut:#667781;--link:#027eb5;--tick:#53bdeb;
  --chip:#ffeecd;--chip-txt:#54656f;--bar:#f0f2f5;--field:#fff;--send:#008069;
  --sheet:#fff;--line:#e9edef;--page:#d1d7db;--shadow:0 1px .5px rgba(11,20,26,.13);
}
@media (prefers-color-scheme:dark){:root{
  --wall:#0b141a;--wall-dot:#111d25;--head:#202c33;--head-txt:#e9edef;--head-sub:#8696a0;
  --in:#202c33;--out:#005c4b;--txt:#e9edef;--mut:#8696a0;--link:#53bdeb;
  --chip:#182229;--chip-txt:#ffd279;--bar:#202c33;--field:#2a3942;--send:#008069;
  --sheet:#202c33;--line:#2a3942;--page:#0b141a;--shadow:0 1px .5px rgba(11,20,26,.4);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--txt);font:400 15.5px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;overflow:hidden}
button{font:inherit;color:inherit;touch-action:manipulation}
svg{display:block;flex:none}

/* Teléfono: a pantalla completa en celular; con marco en pantallas grandes */
.phone{position:relative;width:100%;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--wall);overflow:hidden}
@media (min-width:520px) and (min-height:620px){
  .phone{width:min(400px,100vw - 32px);height:min(860px,100dvh - 32px);border-radius:34px;box-shadow:0 0 0 9px #111b21,0 24px 60px rgba(11,20,26,.35)}
}

header{display:flex;align-items:center;gap:6px;padding:max(8px,env(safe-area-inset-top)) 6px 8px max(4px,env(safe-area-inset-left));background:var(--head);color:var(--head-txt);min-height:56px}
.ib{width:44px;height:44px;border:0;border-radius:50%;background:transparent;display:grid;place-items:center;color:inherit;cursor:pointer}
.ib:focus-visible,.opts button:focus-visible,#sendSel:focus-visible{outline:2px solid var(--tick);outline-offset:-2px}
.pick:has(input:focus-visible){outline:2px solid var(--tick);outline-offset:-2px}
.sheet:focus{outline:0}
.av{width:38px;height:38px;border-radius:50%;background:#7b3f98;color:#fff;display:grid;place-items:center;font-weight:600;flex:none}
.who{min-width:0;flex:1;margin-left:4px}
.who b{display:flex;align-items:center;gap:5px;min-width:0;font-weight:600;font-size:clamp(15px,4.6vw,17px);line-height:1.2}
.who b span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{display:block;color:var(--head-sub);font-size:13px;line-height:1.2}

#chat{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:10px 10px 8px;display:flex;flex-direction:column;gap:2px;
  background-color:var(--wall);background-image:radial-gradient(var(--wall-dot) 1.2px,transparent 1.4px);background-size:22px 22px;
  padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right))}
#chat::-webkit-scrollbar{width:6px}#chat::-webkit-scrollbar-thumb{background:#8696a055;border-radius:3px}

.row{display:flex;flex-direction:column;max-width:86%;margin-top:6px}
.row.in{align-self:flex-start}.row.out{align-self:flex-end}
.row.cont{margin-top:0}
.m{position:relative;display:flow-root;padding:6px 8px 6px 9px;border-radius:8px;box-shadow:var(--shadow);white-space:pre-wrap;overflow-wrap:anywhere;color:var(--txt)}
.m.in{background:var(--in);--c:var(--in)}.m.out{background:var(--out);--c:var(--out)}
.m.tail.in{border-top-left-radius:0}.m.tail.out{border-top-right-radius:0}
.m.tail::before{content:"";position:absolute;top:0;width:9px;height:13px;background:var(--c)}
.m.tail.in::before{left:-8px;clip-path:polygon(100% 0,100% 100%,0 0)}
.m.tail.out::before{right:-8px;clip-path:polygon(0 0,0 100%,100% 0)}
.m a{color:var(--link);text-decoration:underline;text-underline-offset:2px}
.t{float:right;margin:7px 0 -3px 12px;display:inline-flex;align-items:center;gap:3px;font-size:11px;line-height:1;color:var(--mut);white-space:nowrap}
.m.out .t{color:#667781}
@media (prefers-color-scheme:dark){.m.out .t{color:#99beb7}}

.opts{display:flex;flex-direction:column;gap:2px;margin-top:2px}
.opts button{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 12px;border:0;border-radius:8px;background:var(--in);color:var(--link);font-weight:500;text-align:center;box-shadow:var(--shadow);cursor:pointer;transition:filter .15s}
.opts button:active{filter:brightness(.92)}
@media (hover:hover){.opts button:not(:disabled):hover{filter:brightness(.96)}}
.opts button:disabled{opacity:.55;cursor:default}

.chip{align-self:center;max-width:92%;margin:8px 0 2px;padding:5px 10px;border-radius:8px;background:var(--chip);color:var(--chip-txt);font-size:12.5px;line-height:1.35;text-align:center;box-shadow:var(--shadow)}

.typing{display:flex;gap:4px;padding:11px 12px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--mut);opacity:.5;animation:blink 1.1s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,60%,100%{opacity:.35;transform:none}30%{opacity:1;transform:translateY(-2px)}}

form{display:flex;align-items:center;gap:6px;padding:6px 8px max(8px,env(safe-area-inset-bottom));padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right));background:transparent}
.field{flex:1;display:flex;align-items:center;min-height:46px;background:var(--field);border-radius:23px;padding:0 16px;box-shadow:var(--shadow)}
input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--txt);font:inherit;font-size:16px;padding:10px 0}
input::placeholder{color:var(--mut)}
#go{width:46px;height:46px;border:0;border-radius:50%;background:var(--send);color:#fff;display:grid;place-items:center;cursor:pointer}
#go:active{filter:brightness(.9)}

/* Lista de opciones: hoja inferior, como en WhatsApp */
.backdrop{position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(11,20,26,.5);opacity:0;pointer-events:none;transition:opacity .25s cubic-bezier(.16,1,.3,1);z-index:4}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:82%;display:flex;flex-direction:column;background:var(--sheet);border-radius:16px 16px 0 0;transform:translateY(102%);transition:transform .32s cubic-bezier(.16,1,.3,1);z-index:5;padding-bottom:env(safe-area-inset-bottom)}
.open .backdrop{opacity:1;pointer-events:auto}.open .sheet{transform:none}
.sheet-head{display:flex;align-items:center;gap:4px;padding:6px 8px 4px 4px;border-bottom:1px solid var(--line)}
.sheet-head h2{margin:0;font-size:17px;font-weight:600}
.sheet-list{overflow-y:auto;padding:4px 0}
.pick{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:8px 18px;cursor:pointer;border-bottom:1px solid var(--line)}
.pick:last-child{border-bottom:0}
.pick input{position:absolute;opacity:0;pointer-events:none}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--mut);display:grid;place-items:center;flex:none;transition:border-color .15s}
.dot::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--send);transform:scale(0);transition:transform .18s cubic-bezier(.16,1,.3,1)}
.pick input:checked~.dot{border-color:var(--send)}.pick input:checked~.dot::after{transform:scale(1)}
.sheet-foot{padding:10px 16px 12px;border-top:1px solid var(--line)}
#sendSel{width:100%;min-height:48px;border:0;border-radius:24px;background:var(--send);color:#fff;font-weight:600;cursor:pointer}
#sendSel:disabled{opacity:.4;cursor:default}

@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation:none!important}}
</style>
</head>
<body>
<noscript><p style="font:16px/1.5 system-ui,sans-serif;padding:24px;margin:0">Este simulador necesita JavaScript. Si lo abriste desde un archivo en WhatsApp o Archivos, ábrelo desde un enlace en Safari o Chrome.</p></noscript>
<div class="phone" id="phone">
  <header>
    <div class="av" aria-hidden="true">Z</div>
    <div class="who">
      <b><span>Zulma Dahian Extensiones</span>
        <svg width="16" height="16" viewBox="0 0 24 24" aria-label="Cuenta de empresa verificada"><path fill="#25d366" d="M12 1.5l2.6 1.9 3.2-.1 1 3.1 2.6 1.9-1 3.1 1 3.1-2.6 1.9-1 3.1-3.2-.1L12 22.5l-2.6-1.9-3.2.1-1-3.1-2.6-1.9 1-3.1-1-3.1 2.6-1.9 1-3.1 3.2.1z"/><path fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M8 12.2l2.7 2.7L16.2 9.4"/></svg>
      </b>
      <small>cuenta de empresa · simulación</small>
    </div>
    <button class="ib" id="reset" type="button" aria-label="Reiniciar conversación" title="Reiniciar conversación">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
    </button>
  </header>

  <div id="chat" role="log" aria-live="polite"></div>

  <form id="f" autocomplete="off">
    <label class="field"><span class="sr" hidden>Mensaje</span>
      <input id="i" placeholder="Mensaje" enterkeyhint="send" autocomplete="off" autocapitalize="sentences">
    </label>
    <button id="go" type="submit" aria-label="Enviar">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4l17.5-7.5c.8-.3.8-1.5 0-1.8L3.4 3.6c-.7-.3-1.4.3-1.4 1l0 4.6c0 .5.4.9.8 1l10.2 1.8-10.2 1.8c-.5.1-.8.5-.8 1l0 4.6c0 .7.7 1.2 1.4.9z"/></svg>
    </button>
  </form>

  <div class="backdrop" id="bd"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1">
    <div class="sheet-head">
      <button class="ib" id="sx" type="button" aria-label="Cerrar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <h2 id="sheetTitle">Zulma Dahian Extensiones</h2>
    </div>
    <div class="sheet-list" id="sl" role="radiogroup" aria-labelledby="sheetTitle"></div>
    <div class="sheet-foot"><button id="sendSel" type="button" disabled>Enviar</button></div>
  </div>
</div>

<script>
// ---- Datos (copiados de las Data Tables; el último valor por clave gana) ----
const info = {
  valoracion_min:'45',
  direccion:'Boulevard Colosio #1825, entre J. Mujica y Toronja. La Paz, BCS.',
  maps:'https://www.google.com/maps/search/?api=1&query=Boulevard+Colosio+1825+La+Paz+BCS',
  horarios:'Lunes a viernes: 9:00 a.m. – 7:00 p.m.\nSábado: 9:00 a.m. – 2:00 p.m.\nDomingo: Cerrado',
  hora_apertura:'9', hora_cierre:'19', hora_cierre_sabado:'14', dias_laborales:'1,2,3,4,5,6',
  asesor:'Con gusto 🤍 Una persona de Recepción te responderá por este mismo chat en cuanto pueda. Mientras tanto, el asistente automático no te responderá.',
  pausa_asesor_min:'90'
};
const precios = [
 ['cabello_oscuro','cab_osc_18',33],['cabello_oscuro','cab_osc_20',36],['cabello_oscuro','cab_osc_22',39],['cabello_oscuro','cab_osc_24',42],['cabello_oscuro','cab_osc_26',45],['cabello_oscuro','cab_osc_28',48],
 ['cabello_claro','cab_claro_18',43],['cabello_claro','cab_claro_20',46],['cabello_claro','cab_claro_22',49],['cabello_claro','cab_claro_24',52],['cabello_claro','cab_claro_26',55],['cabello_claro','cab_claro_28',58],
 ['recargo','rizado',5],['preparacion','prep_microchip',10],['preparacion','prep_nanochip',15],['preparacion','prep_tape',10],['preparacion','prep_cortinas',0],
 ['aplicacion','apl_microchip',10],['aplicacion','apl_nanochip',15],['aplicacion','apl_tape',10],['aplicacion','apl_cortinas',20],['retiro','retiro',5]
].map(([categoria,clave,precioPorGramoMXN])=>({categoria,clave,precioPorGramoMXN}));

const money=n=>'$'+Number(n).toLocaleString('es-MX');
const p=k=>{const r=precios.find(x=>x.clave===k);return r?r.precioPorGramoMXN:0};
const lineaCab=cat=>precios.filter(x=>x.categoria===cat).map(x=>x.clave.split('_').pop()+'" '+money(x.precioPorGramoMXN)).join(' · ');
const durVal=Number(info.valoracion_min||45);
const firma='\n\n*ZULMA DAHIAN EXTENSIONES*\n_Luxury Hair Extensions._';

function textoPrecios(){return '🛍️ *Precios por gramo* (MXN)\n\n✨ *Cabello virgen, tono oscuro natural*\n'+lineaCab('cabello_oscuro')+'\n\n✨ *Tonos café, miel o rubio*\n'+lineaCab('cabello_claro')+'\n_Cabello rizado: +'+money(p('rizado'))+' por gramo_\n\n🤍 *Preparación*\nMicrochip '+money(p('prep_microchip'))+' · Nanochip '+money(p('prep_nanochip'))+' · Tape '+money(p('prep_tape'))+'\n\n🤍 *Aplicación*\nMicrochip '+money(p('apl_microchip'))+' · Nanochip '+money(p('apl_nanochip'))+' · Tape '+money(p('apl_tape'))+' · Cortinas '+money(p('apl_cortinas'))+'\n\n🤍 *Retiro:* '+money(p('retiro'))+'\n\n➖ Total = gramos × (cabello + rizado + preparación + aplicación).\n\nLos gramos los define la especialista en tu valoración, que *no tiene ningún costo* (~'+durVal+' min). Ahí te damos tu precio final.\n\n¿Deseas agendarla? 🤍'}

const txt=b=>({type:'text',body:b});
const buttons=(b,l)=>({type:'buttons',body:b,items:l.map(x=>({id:x[0],title:x[1]}))});
const lista=(b,label,rows)=>({type:'list',body:b,label,items:rows});

// Motivo de la cita según la pantalla desde la que el cliente pulsó "Agendar cita"
const MOTIVOS={gen:'Valoración general',pre:'Consulta de precios',ext:'Extensiones',pel:'Pelucas y prótesis',alo:'Alopecia o pérdida de cabello',tec:'Técnicas de aplicación'};
const AG=k=>['g_'+k,'📅 Agendar cita'];
const AGENDAR=AG('gen'),MENU=['m_menu','↩️ Menú principal'],MASSERV=['m_info','↩️ Más servicios'];
const menu=intro=>lista((intro||'Buen día, te damos la bienvenida a Zulma Dahian Extensiones.\n\nNos encanta tenerte aquí. Queremos brindarte una atención personalizada desde el primer momento y ayudarte a encontrar la mejor opción para ti.')+'\n\nPor favor, selecciona la opción que deseas consultar 👇'+firma,'Ver opciones',[
 {id:'g_gen',title:'📅 Agendar cita'},{id:'m_info',title:'✨ Servicios y técnicas'},{id:'m_servicios',title:'🛍️ Precios'},
 {id:'m_ubicacion',title:'📍 Horarios y ubicación'},{id:'m_asesor',title:'💬 Hablar con alguien'}]);

const DIAS=['dom','lun','mar','mié','jue','vie','sáb'],MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIASL=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'],MESESL=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const wd=d=>d.getDay()===0?7:d.getDay();
const fechaLarga=f=>{const [y,m,d]=f.split('-').map(Number);const dt=new Date(y,m-1,d);return DIASL[dt.getDay()]+' '+d+' de '+MESESL[m-1]};

let ses,pausadoHasta=0;
const perfil='Cliente Demo'; // en WhatsApp real: nombre del perfil del cliente
const fresh=()=>({paso:'menu',servicio:'',motivo:'',motivoClave:'',duracionMin:0,fecha:'',hora:'',nombre:''});
ses=fresh();
let registro=null; // lo que se guardaría en Calendar y Sheets al confirmar

// El bot reacciona a botones/listas (id). El texto solo se acepta al pedir el nombre; en cualquier otro momento muestra el menú.
function decide(id,texto){
  const now=Date.now();
  if(pausadoHasta>now) return {silent:true};
  const s=Object.assign({},ses); const paso=s.paso;
  const reset=()=>{Object.assign(s,fresh())};
  let payload,pausa=0;
  if(id==='m_servicios'){const b=textoPrecios();payload=b.length<=1024?buttons(b,[AG('pre'),MENU]):txt(b);reset()}
  else if(id.indexOf('g_')===0){
    // Agendar: va directo a elegir fecha. El motivo (de qué pantalla vino el cliente) se guarda en la sesión.
    const clave=id.slice(2);reset();
    s.motivo=MOTIVOS[clave]||MOTIVOS.gen;s.motivoClave=MOTIVOS[clave]?clave:'gen';
    s.servicio='Valoración presencial';s.duracionMin=durVal;
    const lab=info.dias_laborales.split(',').map(Number),filas=[];
    for(let d=0;d<21&&filas.length<7;d++){const dia=new Date();dia.setDate(dia.getDate()+d);if(lab.indexOf(wd(dia))<0)continue;
      filas.push({id:'f_'+iso(dia),title:DIAS[dia.getDay()]+' '+dia.getDate()+' '+MESES[dia.getMonth()]})}
    payload=lista('✨ *Tu experiencia Zulma Dahian Extensiones comienza con una valoración personalizada.*\n\nHacemos un análisis capilar completo: salud del cuero cabelludo y folículos, cantidad, densidad, largo, color y el resultado que deseas lograr. 🤍\n\n➖ Dura aproximadamente '+durVal+' minutos y *NO TIENE NINGÚN COSTO*.\n\n📅 ¿Qué día te acomoda?','Ver fechas',filas)}
  else if(id==='m_info'){reset();payload=lista('✨ *Servicios y técnicas*\n\nContamos con soluciones estéticas y funcionales, todo comienza con una valoración personalizada.\n\n¿Cuál de nuestros servicios te gustaría conocer? 🤍','Ver opciones',[
    {id:'i_ext',title:'🤍 Extensiones'},{id:'i_pel',title:'👑 Pelucas y prótesis'},{id:'i_alo',title:'🌷 Alopecia o pérdida'},{id:'i_tec',title:'✨ Técnicas'},{id:'m_menu',title:'↩️ Menú principal'}])}
  else if(id==='i_ext'){payload=buttons('🤍 *Extensiones*\n\nRealizamos aplicaciones de extensiones con cabello premium, parejo de raíz a puntas, y un resultado natural.\n\nTambién damos *mantenimiento*: retiro, ajuste y reinstalación.\n\nTodo comienza con una valoración. ¿Deseas agendarla?',[AG('ext'),MASSERV,MENU]);reset()}
  else if(id==='i_pel'){payload=buttons('👑 *Pelucas, toppers y prótesis capilares*\n\nRealizamos pelucas personalizadas, toppers y prótesis capilares hechos a tu medida, cómodos y de aspecto natural.\n\nEn tu valoración definimos cuál es la mejor opción para ti. ¿Deseas agendarla?',[AG('pel'),MASSERV,MENU]);reset()}
  else if(id==='i_alo'){payload=buttons('🌷 *Estamos contigo.*\n\nSi vives alopecia o pérdida de cabello, hay opciones hechas a tu medida: toppers, prótesis capilares y pelucas personalizadas, con un resultado natural, cómodo y elegante.\n\nTodo empieza con una valoración personalizada para entender tu caso y recomendarte lo más adecuado. 🤍\n\n¿Deseas agendarla?',[AG('alo'),['m_asesor','💬 Hablar con alguien'],MASSERV]);reset()}
  else if(id==='i_tec'){payload=buttons('✨ *Técnicas de aplicación*\n\n🤍 *Microchip*\n🤍 *Nanochip*\n🤍 *Tape*\n🤍 *Cortina* (clip-in o cosida)\n\nLa técnica ideal depende de la densidad de tu cabello, tu estilo de vida y de si hay pérdida de cabello. En tu valoración te recomendamos la que mejor va contigo. 🤍\n\n¿Deseas agendarla?',[AG('tec'),MASSERV,MENU]);reset()}
  else if(id==='m_ubicacion'){payload=buttons('📍 *Ubicación*\n'+info.direccion+'\n'+info.maps+'\n\n🕘 *Horarios*\n'+info.horarios+'\n\nAtendemos *solo con cita previa* 🤍'+firma,[AGENDAR,MENU]);reset()}
  else if(id==='m_asesor'){payload=txt(info.asesor);reset();pausa=Number(info.pausa_asesor_min||90)}
  else if(id.indexOf('f_')===0){
    s.fecha=id.slice(2);s.paso='elige_hora';
    const [y,m,d]=s.fecha.split('-').map(Number),dia=new Date(y,m-1,d);
    const abre=Number(info.hora_apertura),cierra=wd(dia)===6?Number(info.hora_cierre_sabado):Number(info.hora_cierre);
    const dur=Number(s.duracionMin||45),paso2=Math.max(30,Math.ceil(dur/30)*30),libres=[];
    for(let min=abre*60;min+dur<=cierra*60;min+=paso2){const ini=new Date(y,m-1,d,0,min);if(ini.getTime()<=now)continue;libres.push(pad(ini.getHours())+':'+pad(ini.getMinutes()))}
    payload=libres.length?lista('🕘 Estos son los horarios disponibles para el '+fechaLarga(s.fecha)+'. ¿Cuál prefieres?','Ver horarios',libres.slice(0,10).map(h=>({id:'h_'+h,title:h}))):buttons('Ese día ya no tenemos horarios disponibles 🤍',[['g_'+(s.motivoClave||'gen'),'📅 Otra fecha'],MENU])}
  else if(id.indexOf('h_')===0){
    s.hora=id.slice(2);s.paso='pide_nombre';
    payload=buttons('✨ Ya casi terminamos.\n\n¿A nombre de quién agendo tu cita? Escribe tu nombre o usa el de tu perfil 🤍',[['n_perfil',('Usar '+perfil).slice(0,20)]])}
  else if(paso==='pide_nombre'&&(id==='n_perfil'||(!id&&texto))){
    s.nombre=(id==='n_perfil'?perfil:texto).slice(0,60);s.paso='confirma';
    payload=buttons('✨ *Resumen de tu cita*\n\n👤 Nombre: '+s.nombre+'\n💇‍♀️ Servicio: '+s.servicio+' (~'+s.duracionMin+' min)\n🎯 Motivo: '+s.motivo+'\n📅 Fecha: '+fechaLarga(s.fecha)+'\n🕘 Hora: '+s.hora+'\n➖ Costo: *sin ningún costo*\n\n¿Confirmas tu cita?',[['c_si','✅ Confirmar'],['c_no','Cancelar']])}
  else if(id==='c_si'&&paso==='confirma'){
    payload=txt('✨ ¡Todo listo, '+s.nombre+'! Tu '+s.servicio.toLowerCase()+' quedó agendada para el '+fechaLarga(s.fecha)+' a las '+s.hora+' (dura aproximadamente '+s.duracionMin+' min).\n\n📍 '+info.direccion+'\n'+info.maps+'\n\nSerá un placer recibirte. 🤍'+firma);
    registro={titulo:s.servicio+' - '+s.motivo+' - '+s.nombre,servicio:s.servicio,motivo:s.motivo,fecha:s.fecha,hora:s.hora,nombre:s.nombre};reset()}
  else if(id==='c_no'){reset();payload=menu('Sin problema, cancelé la solicitud 🤍 ¿En qué más te puedo ayudar?')}
  else{reset();payload=menu()} // incluye m_menu y CUALQUIER texto
  ses=s; if(pausa) pausadoHasta=now+pausa*60000;
  return {payload,pausa};
}

// ---- UI ----
const chat=document.getElementById('chat'),input=document.getElementById('i'),phone=document.getElementById('phone');
const TICKS='<svg width="16" height="11" viewBox="0 0 16 11" fill="none" stroke="#53bdeb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-label="leído"><path d="M1 5.8l3 3L10 1.5M6.5 8.3l.6.6L13.5 1.5"/></svg>';
let last=null; // quién escribió el último mensaje (para dibujar la colita solo en el primero de cada racha)
const hhmm=()=>new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',hour12:false});
const down=()=>{chat.scrollTop=chat.scrollHeight};
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function fmt(t){return esc(t).replace(/\*([^*\n]+)\*/g,'<b>$1</b>').replace(/_([^_\n]+)_/g,'<i>$1</i>').replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>')}
function bubble(cls,html,withTime=true){
  const row=document.createElement('div');row.className='row '+cls+(last===cls?' cont':'');
  const b=document.createElement('div');b.className='m '+cls+(last===cls?'':' tail');
  b.innerHTML=html+(withTime?'<span class="t">'+hhmm()+(cls==='out'?TICKS:'')+'</span>':'');
  row.appendChild(b);chat.appendChild(row);last=cls;down();return row;
}
function sys(t){const d=document.createElement('div');d.className='chip';d.textContent=t;chat.appendChild(d);last=null;down()}
function lockOpts(){document.querySelectorAll('.opts button').forEach(b=>{b.disabled=true})}
function typing(){const r=bubble('in','<span class="typing" aria-label="Escribiendo"><i></i><i></i><i></i></span>',false);return r}
function render(pl){
  const row=bubble('in',fmt(pl.body));
  if(pl.type==='text')return;
  const w=document.createElement('div');w.className='opts';
  if(pl.type==='list'){
    const b=document.createElement('button');b.type='button';
    b.innerHTML='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span></span>';
    b.lastChild.textContent=pl.label;b.onclick=()=>openSheet(pl);w.appendChild(b);
  }else pl.items.forEach(it=>{const b=document.createElement('button');b.type='button';b.textContent=it.title;b.onclick=()=>send({id:it.id,title:it.title});w.appendChild(b)});
  row.appendChild(w);down();
}
function send({id='',title='',text=''}){
  lockOpts();
  bubble('out',esc(title||text));
  const t=typing();
  setTimeout(()=>{
    t.remove();last='in';
    const r=decide(id,text);
    input.placeholder=ses.paso==='pide_nombre'?'Escribe tu nombre':'Mensaje';
    if(r.silent){sys('Bot en pausa: recepción atiende este chat. No responde.');return}
    render(r.payload);
    if(registro){sys('📅 Calendar: «'+registro.titulo+'» · '+registro.fecha+' '+registro.hora);sys('📊 Sheets → Servicio: '+registro.servicio+' | Motivo: '+registro.motivo+' | Cliente: '+registro.nombre);registro=null}
    if(r.pausa)sys('Bot pausado '+r.pausa+' min (pausadoHasta guardado en Zulma Sesiones)');
  },700);
}

// ---- Hoja de lista (selección + Enviar, igual que WhatsApp) ----
const sheetEl=document.getElementById('sheet'),sl=document.getElementById('sl'),sendSel=document.getElementById('sendSel');
let chosen=null,lastFocus=null;
function openSheet(pl){
  lastFocus=document.activeElement;chosen=null;sendSel.disabled=true;sl.innerHTML='';
  pl.items.forEach((it,n)=>{
    const l=document.createElement('label');l.className='pick';
    const r=document.createElement('input');r.type='radio';r.name='opt';r.value=it.id;
    r.onchange=()=>{chosen=it;sendSel.disabled=false};
    const s=document.createElement('span');s.textContent=it.title;
    const d=document.createElement('span');d.className='dot';d.setAttribute('aria-hidden','true');
    l.append(r,s,d);sl.appendChild(l);
  });
  phone.classList.add('open');
  setTimeout(()=>sheetEl.focus({preventScroll:true}),60);
}
function closeSheet(){phone.classList.remove('open');if(lastFocus&&lastFocus.focus)lastFocus.focus({preventScroll:true})}
document.getElementById('sx').onclick=closeSheet;
document.getElementById('bd').onclick=closeSheet;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&phone.classList.contains('open'))closeSheet()});
sendSel.onclick=()=>{if(!chosen)return;const it=chosen;phone.classList.remove('open');send({id:it.id,title:it.title})};

// iPhone: al abrir el teclado el área visible se achica; ajustamos el alto para que el campo de texto no quede tapado
if(window.visualViewport){
  const vv=window.visualViewport,framed=matchMedia('(min-width:520px) and (min-height:620px)');
  const fit=()=>{if(framed.matches){phone.style.height='';return}phone.style.height=vv.height+'px';window.scrollTo(0,0);down()};
  vv.addEventListener('resize',fit);vv.addEventListener('scroll',()=>window.scrollTo(0,0));fit();
}
document.getElementById('f').onsubmit=e=>{e.preventDefault();const v=input.value.trim();if(!v)return;input.value='';send({text:v})};
document.getElementById('reset').onclick=()=>{ses=fresh();registro=null;pausadoHasta=0;chat.innerHTML='';last=null;input.placeholder='Mensaje';phone.classList.remove('open');sys('Sesión reiniciada')};
sys('Simulación local: sin WhatsApp, Calendar ni Sheets. Escribe cualquier mensaje (por ejemplo, «Hola») para ver el menú; después usa los botones.');
</script>
